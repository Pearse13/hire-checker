<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hire Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: plant-yellow site band, two drop zones, then one supplier at a time as a stack of ledger tables. */
:root {
  --bg: #eef0ed;
  --surface: #ffffff;
  --ink: #1b2326;
  --muted: #5a6569;
  --line: #d6dbd8;
  --band: #f2b705;
  --band-ink: #1b2326;
  --ok: #2c7a4b;
  --ok-fill: #c6efce;
  --ok-ink: #14532d;
  --flag: #b0361e;
  --flag-fill: #fbe4de;
  --warn: #8a5a00;
  --warn-fill: #fdf0cc;
  --focus: #1f6fd1;
  --btn: #1d4f73;
  --btn-hover: #163d59;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131819; --surface: #1b2224; --ink: #e5e9e6; --muted: #9aa6a9; --line: #2e383b;
    --ok: #6fcf97; --ok-fill: #1d3a29; --ok-ink: #b9ecca;
    --flag: #f08a70; --flag-fill: #3a1f19; --warn: #f2c14e; --warn-fill: #352a10; --focus: #6aa8f0; --btn: #2a6a96; --btn-hover: #327cb0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131819; --surface: #1b2224; --ink: #e5e9e6; --muted: #9aa6a9; --line: #2e383b;
  --ok: #6fcf97; --ok-fill: #1d3a29; --ok-ink: #b9ecca;
  --flag: #f08a70; --flag-fill: #3a1f19; --warn: #f2c14e; --warn-fill: #352a10; --focus: #6aa8f0; --btn: #2a6a96; --btn-hover: #327cb0;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.wrap { max-width: 1120px; width: 100%; margin: 0 auto; padding-inline: 20px; padding-block: 0 64px; }
/* Before a check runs, the upload boxes sit in the middle of the screen */
main.wrap { flex: 1; }
body.empty main.wrap { display: flex; flex-direction: column; justify-content: center; padding-block: 32px; }
body.empty .inputs { margin-top: 0; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.code { font-family: var(--mono); font-size: 13px; letter-spacing: 0.01em; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* Site band */
.band { background: var(--band); color: var(--band-ink); }
.band .wrap { padding-block: 18px 16px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
.band h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; }
.band p { margin: 0; font-weight: 600; font-size: 14px; }
.stripe { height: 8px; background: repeating-linear-gradient(-45deg, var(--band-ink) 0 10px, var(--band) 10px 20px); }

/* Drop zones */
.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
@media (max-width: 720px) { .inputs { grid-template-columns: 1fr; } }
.drop { position: relative; background: var(--surface); border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; transition: border-color .15s, background-color .15s; }
.drop.over { border-color: var(--focus); }
body.checking .inputs { gap: 8px; }
body.checking .drop { padding: 8px 12px; gap: 0; }
body.checking .drop :is(.step, h2, p, .pick, .files small) { display: none; }
body.checking .drop .files { font-size: 13px; }
.drop.filled { border-style: solid; }
.drop .step { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.drop h2 { font-size: 19px; font-weight: 600; }
.drop p { margin: 0; color: var(--muted); font-size: 14px; }
.drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.drop .files { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; z-index: 1; pointer-events: none; }
.file { font-size: 14px; font-weight: 600; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 8px; align-items: baseline; overflow-wrap: anywhere; }
.file small { font-weight: 400; color: var(--muted); }
.pick { align-self: center; position: relative; z-index: 0; background: var(--btn); color: #ffffff; border-radius: 4px; padding: 7px 16px; font-size: 14px; font-weight: 700; pointer-events: none; transition: background-color .15s; }
.drop:hover .pick, .drop.over .pick { background: var(--btn-hover); }

.notice { margin-top: 16px; padding: 10px 14px; border-radius: var(--radius); font-size: 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.notice.info { background: var(--warn-fill); color: var(--ink); }
.notice.info b { color: var(--warn); }
.notice.error { background: var(--flag-fill); }
.notice.error b { color: var(--flag); }

/* Supplier switcher */
.suppliers { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; }
.sup-tab { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 10px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: 100%; }
.sup-tab[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 -3px 0 var(--band); }
.sup-tab .n { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.sup-tab .s { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-fill); color: var(--ok-ink); }
.pill.flag { background: var(--flag-fill); color: var(--flag); }
.pill.warn { background: var(--warn-fill); color: var(--warn); }

/* Supplier result */
.result { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.result-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.result-head h2 { font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
.result-head .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.controls label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.controls select { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); max-width: 260px; }
.btn { border: 0; background: var(--btn); color: #ffffff; padding: 8px 16px; border-radius: 4px; font-weight: 700; font-size: 14px; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--btn-hover); }
.btn:disabled { opacity: .5; cursor: default; }

.totals { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
@media (max-width: 720px) { .totals { grid-template-columns: repeat(2, 1fr); } }
.total { padding: 14px 20px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); }
.total:last-child { border-right: 0; }
.total b { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.total span { font-size: 13px; color: var(--muted); }
.total.flag b { color: var(--flag); }
.total.ok b { color: var(--ok); }
.total.warn b { color: var(--warn); }

section.block { padding: 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
section.block:last-child { border-bottom: 0; }
.block-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.block-head h3 { font-size: 18px; font-weight: 600; }
.block-head p { margin: 0; color: var(--muted); font-size: 14px; max-width: 68ch; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.desc { min-width: 220px; }
tr.group td { background: var(--bg); font-weight: 700; font-size: 13px; }
tr.matched td { background: var(--ok-fill); color: var(--ok-ink); font-weight: 600; }
tr.current td { box-shadow: inset 0 2px 0 var(--focus), inset 0 -2px 0 var(--focus); }
.hint { font-size: 13px; }
.hint .code { font-weight: 500; }
.hint em { font-style: normal; color: var(--muted); }

/* Suggestions: plain text */

/* Step 3: check each pairing, one at a time */
.review { margin: 24px auto 0; max-width: 640px; width: 100%; background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.rv-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.rv-job { font-size: 22px; font-weight: 700; margin-right: auto; overflow-wrap: anywhere; }
.rv-pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rv-pos b { font-family: var(--display); font-size: 22px; color: var(--ink); }
.rv-kind { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--warn-fill); color: var(--warn); }
.rv-bar { height: 5px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.rv-bar span { display: block; height: 100%; background: var(--ok); transition: width .2s; }
.pc { width: 100%; border-collapse: collapse; table-layout: fixed; }
.pc thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: left; padding: 0 8px 6px; }
.pc thead th:first-child { width: 78px; } .pc thead th:last-child { width: 32px; }
.pc tbody th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 10px 8px; vertical-align: top; }
.pc td { padding: 10px 8px; font-size: 15px; vertical-align: top; overflow-wrap: anywhere; border-top: 1px solid var(--line); }
.pc tbody th { border-top: 1px solid var(--line); }
.pc-code { display: block; font-family: var(--mono, ui-monospace, monospace); font-size: 12px; color: var(--muted); margin-top: 2px; }
.pc-none { color: var(--flag); font-style: italic; }
.pc-left { color: var(--flag); font-style: italic; }
.pc-one tbody th { width: 78px; }
.rv-note { margin: 0; font-size: 14px; color: var(--warn); }
.rv-outcome-head { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: -4px; }
.rv-outcomes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rv-outcomes .btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 50px; padding: 8px 12px; text-align: left; line-height: 1.25; font-size: 15px; }
.rv-outcomes .btn:last-child:nth-child(odd) { grid-column: 1 / -1; }
.rv-outcomes .btn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px #fff; }
.rv-outcomes kbd { flex: none; font: inherit; font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255, 255, 255, .18); }
@media (hover: none) { .rv-outcomes kbd { display: none; } }
.rv-other { display: flex; gap: 8px; }
.rv-other input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
.pc .rv-kind, .tally .rv-kind { display: inline-block; margin-top: 3px; font-size: 11px; white-space: nowrap; }
.rv-job small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }
.tally { width: 100%; border-collapse: collapse; }
.tally td, .tally th { padding: 8px; font-size: 15px; vertical-align: top; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.tally td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tally td.num:last-child { color: var(--muted); }
.tally tfoot th { text-align: left; font-size: 13px; color: var(--muted); }
.tally tfoot td, .tally tfoot th { border-top: 2px solid var(--ink); font-size: 16px; }
.tally tfoot td.num { color: inherit; }
.tally tfoot .pc-mark { margin-left: 6px; }
.pc-bad .pc-mark { color: var(--flag); } .pc-ok .pc-mark { color: var(--ok); }
.tally .pc-bad td, .tally .pc-bad th { background: var(--flag-fill); }
@media (max-width: 560px) {
  .pc thead th:first-child { width: 70px; } .pc thead th:last-child { width: 22px; }
  .pc td, .pc tbody th { padding: 8px 4px; }
  .pc tbody th { font-size: 11px; }
  .tally td, .tally th { padding: 8px 4px; font-size: 14px; }
}
.pc small { font-weight: 400; font-size: 11px; }
.pc-mark { font-size: 18px; font-weight: 700; text-align: center; }
.pc-ok .pc-mark { color: var(--ok); }
.pc-bad td, .pc-bad th { background: var(--flag-fill, #fde8e8); }
.pc-bad .pc-mark { color: var(--flag); }
.rv-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rv-actions .btn { padding-block: 10px; }
.rv-actions .btn.big { flex: 1 1 140px; padding-block: 14px; font-size: 16px; }
.rv-actions kbd { font: inherit; font-size: 12px; opacity: .7; margin-left: 4px; }
@media (hover: none) { .rv-actions kbd { display: none; } }
.rv-done p { margin: 0; }
.run-box { display: flex; justify-content: center; }
.run-box:not(:empty) { margin-top: 16px; }
.btn.run { font-size: 16px; padding: 12px 32px; }

/* Step 4: marked-up spreadsheets */
.marked { margin-top: 24px; background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.mk-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.mk-head .step { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.mk-head h2 { font-size: 19px; font-weight: 600; }
.mk-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; max-width: 68ch; }
.mk-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.mk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.mk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; border-top: 1px solid var(--line); }
.mk-name { flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mk-name .code { white-space: normal; overflow-wrap: anywhere; font-weight: 500; }
.mk-name small { color: var(--muted); font-size: 13px; }

details > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details[open] > summary { margin-bottom: 10px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<header class="band">
  <div class="wrap">
    <h1>Hire Check</h1>
  </div>
  <div class="stripe" aria-hidden="true"></div>
</header>

<main class="wrap">
  <div class="inputs">
    <div class="drop" id="acsDrop">
      <span class="step">Step 1</span>
      <h2>ACS on-hire report</h2>
      <p>One workbook, a sheet per job.</p>
      <div class="files" id="acsFiles"></div>
      <span class="pick">Choose file</span>
      <input type="file" id="acsInput" accept=".xlsx,.xlsm" aria-label="Choose the ACS on-hire report">
    </div>
    <div class="drop" id="supDrop">
      <span class="step">Step 2</span>
      <h2>Supplier hire reports</h2>
      <p>One Excel file per supplier.</p>
      <div class="files" id="supFiles"></div>
      <span class="pick">Choose files</span>
      <input type="file" id="supInput" accept=".xlsx,.xlsm" multiple aria-label="Choose supplier hire reports">
    </div>
  </div>

  <div id="runBox" class="run-box"></div>
  <div id="notices"></div>
  <div id="review"></div>
  <div id="marked"></div>
  <div class="suppliers" id="tabs" role="tablist" aria-label="Supplier reports"></div>
  <div id="result"></div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>

</script>
<script>

</script>

</body>
</html>
